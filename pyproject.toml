[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baynex-stationery"
version = "0.1.0"
description = "Arabic-first offline desktop ERP foundation for stationery and print shops"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<7",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1"]

[project.scripts]
baynex-stationery = "baynex_stationery.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"baynex_stationery.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
