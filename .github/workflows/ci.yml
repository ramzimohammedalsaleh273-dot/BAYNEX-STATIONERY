name: Python checks

on:
  push:
    branches: ["main", "work/**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - name: Build wheel and verify bundled migrations
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -c "import glob, zipfile; wheel = glob.glob('dist/*.whl')[0]; names = set(zipfile.ZipFile(wheel).namelist()); required = {'baynex_stationery/migrations/env.py', 'baynex_stationery/migrations/versions/0001_initial_schema.py', 'baynex_stationery/migrations/script.py.mako'}; missing = required - names; assert not missing, f'Missing packaged migration files: {missing}'"
